[package]
name = "lambda-rs"
version = "0.1.0"
edition = "2021"


[dependencies]
lambda_runtime = "^0.13"
serde = "^1.0"
serde_json = "^1.0"
tokio = "^1.43"
tracing = { version = "^0.1", features = ["log"] }
tracing-subscriber = { version = "^0.3", default-features = false, features = [
  "fmt",
  "env-filter",
  "json",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
